# Cabeceras de seguridad para todo el sitio.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = """
      default-src 'self'; \
      script-src 'self' 'unsafe-inline' https://www.clarity.ms https://*.clarity.ms; \
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
      font-src 'self' https://fonts.gstatic.com; \
      img-src 'self' data: blob: https://*.clarity.ms https://c.bing.com; \
      connect-src 'self' https://*.clarity.ms https://c.bing.com; \
      frame-src 'self' https://*.sibforms.com; \
      form-action 'self' https://*.sibforms.com; \
      base-uri 'self'; \
      object-src 'none'; \
      frame-ancestors 'none'
      """

# Las funciones devuelven datos de pedidos: nunca deben quedar en cache.
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
