    <style>
        /* Pagina de links: estilos propios, con la paleta del sitio. */
        :root {
            --lk-text: #4A382B;
            --lk-muted: #735C46;
            --lk-teal: #2A7A7D;
            --lk-teal-hover: #22686B;
            --lk-teal-soft: rgba(42, 122, 125, 0.1);
            --lk-card: rgba(252, 250, 246, 0.86);
            --lk-border: rgba(123, 94, 70, 0.16);
        }

        body.links-page {
            min-height: 100svh;
            margin: 0;
            color: var(--lk-text);
            font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
            background:
                radial-gradient(ellipse 60% 40% at 50% 0%, rgba(125, 200, 196, 0.32), transparent 70%),
                linear-gradient(180deg, rgba(248, 236, 224, 0.7), rgba(252, 250, 246, 0.94)),
                url("assets/images/backgrounds/bg-links-legal.webp") center / cover no-repeat fixed,
                #F8ECE0;
        }

        .lk-shell {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: min(100% - 2.5rem, 26rem);
            margin: 0 auto;
            padding: clamp(2.5rem, 7vh, 4rem) 0 2rem;
            text-align: center;
        }

        /* Perfil */
        .lk-avatar {
            display: grid;
            width: 7.5rem;
            height: 7.5rem;
            place-items: center;
            border: 1px solid var(--lk-border);
            border-radius: 50%;
            background: #FCFAF6;
            box-shadow: 0 0 0 6px rgba(252, 250, 246, 0.55), 0 14px 34px rgba(74, 56, 43, 0.12);
        }

        .lk-avatar img { width: 70%; height: auto; }

        .lk-name {
            margin: 1.4rem 0 0.35rem;
            font-family: "Playfair Display", Georgia, serif;
            font-size: 2rem;
            font-weight: 600;
            line-height: 1.15;
        }

        .lk-name em { color: var(--lk-teal); font-weight: 400; }

        .lk-role {
            margin: 0;
            color: var(--lk-teal);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .lk-bio {
            max-width: 21rem;
            margin: 0.9rem 0 2rem;
            color: var(--lk-muted);
            font-size: 0.95rem;
            line-height: 1.55;
        }

        /* Botones */
        .lk-list { display: flex; width: 100%; flex-direction: column; gap: 0.75rem; }

        .lk-btn {
            position: relative;
            display: flex;
            min-height: 3.6rem;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.9rem 3rem;
            border: 1px solid var(--lk-border);
            border-radius: 999px;
            color: var(--lk-text);
            background: var(--lk-card);
            box-shadow: 0 6px 18px rgba(74, 56, 43, 0.06);
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            backdrop-filter: blur(6px);
            transition: transform 220ms ease, box-shadow 220ms ease, background-color 220ms ease, border-color 220ms ease;
        }

        .lk-btn svg { width: 1.2rem; height: 1.2rem; flex: 0 0 auto; color: var(--lk-teal); }

        /* Flecha a la derecha: no mueve el texto, que queda centrado. */
        .lk-btn .lk-arrow {
            position: absolute;
            right: 1.25rem;
            width: 1.05rem;
            height: 1.05rem;
            opacity: 0.55;
            transition: transform 220ms ease, opacity 220ms ease;
        }

        .lk-btn:hover {
            transform: translateY(-2px);
            border-color: rgba(42, 122, 125, 0.35);
            background: #FFFFFF;
            box-shadow: 0 12px 26px rgba(74, 56, 43, 0.1);
        }

        .lk-btn:hover .lk-arrow { transform: translateX(3px); opacity: 1; }
        .lk-btn:active { transform: scale(0.98); }

        .lk-btn:focus-visible {
            outline: 2px solid var(--lk-teal);
            outline-offset: 3px;
        }

        .lk-btn--primary {
            min-height: 3.9rem;
            border-color: transparent;
            color: #FFFFFF;
            background: var(--lk-teal);
            box-shadow: 0 14px 30px rgba(42, 122, 125, 0.28);
            font-size: 1.05rem;
        }

        .lk-btn--primary svg { color: #FFFFFF; }
        .lk-btn--primary:hover { border-color: transparent; background: var(--lk-teal-hover); box-shadow: 0 16px 34px rgba(42, 122, 125, 0.32); }

        .lk-badge {
            padding: 0.2rem 0.55rem;
            border-radius: 999px;
            color: var(--lk-teal);
            background: var(--lk-teal-soft);
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* Contacto */
        .lk-label {
            display: flex;
            width: 100%;
            align-items: center;
            gap: 0.85rem;
            margin: 2rem 0 0.9rem;
            color: var(--lk-muted);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .lk-label::before,
        .lk-label::after { content: ""; flex: 1; height: 1px; background: var(--lk-border); }

        .lk-social { display: flex; justify-content: center; gap: 1rem; }

        .lk-social a {
            display: flex;
            width: 5.4rem;
            flex-direction: column;
            align-items: center;
            gap: 0.45rem;
            color: var(--lk-muted);
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
        }

        .lk-social span.lk-icon {
            display: grid;
            width: 3.4rem;
            height: 3.4rem;
            place-items: center;
            border: 1px solid var(--lk-border);
            border-radius: 50%;
            color: var(--lk-teal);
            background: var(--lk-card);
            box-shadow: 0 6px 18px rgba(74, 56, 43, 0.06);
            transition: transform 220ms ease, background-color 220ms ease, border-color 220ms ease;
        }

        .lk-social svg { width: 1.35rem; height: 1.35rem; }
        .lk-social a:hover span.lk-icon { transform: translateY(-2px); border-color: rgba(42, 122, 125, 0.35); background: #FFFFFF; }
        .lk-social a:focus-visible span.lk-icon { outline: 2px solid var(--lk-teal); outline-offset: 3px; }

        .lk-footer {
            margin-top: 2.75rem;
            color: var(--lk-muted);
            font-size: 0.78rem;
        }

        .lk-footer a { color: var(--lk-muted); }

        /* Entrada suave, escalonada */
        @keyframes lk-in {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: none; }
        }

        .lk-in { opacity: 0; animation: lk-in 650ms cubic-bezier(0.22, 1, 0.36, 1) forwards; animation-delay: calc(var(--i, 0) * 80ms); }

        @media (prefers-reduced-motion: reduce) {
            .lk-in { opacity: 1; animation: none; }
            .lk-btn, .lk-social span.lk-icon { transition: none; }
        }

        @media (max-width: 360px) {
            .lk-name { font-size: 1.75rem; }
            .lk-btn { padding-inline: 2.6rem; font-size: 0.95rem; }
            .lk-social { gap: 0.4rem; }
        }
    </style>
</head>
